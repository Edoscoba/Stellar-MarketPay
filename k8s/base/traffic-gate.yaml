# This endpoint deliberately has no Ready endpoints while PostgreSQL is a
# replica. Including it in the GSLB Ingress prevents traffic from moving to a
# statelessly healthy cluster before database promotion completes.
apiVersion: v1
kind: Service
metadata:
  name: marketpay-traffic-gate
  labels:
    app.kubernetes.io/name: stellar-marketpay
    app.kubernetes.io/component: traffic-gate
spec:
  selector:
    app.kubernetes.io/name: stellar-marketpay
    app.kubernetes.io/component: traffic-gate
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketpay-traffic-gate
  labels:
    app.kubernetes.io/name: stellar-marketpay
    app.kubernetes.io/component: traffic-gate
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-marketpay
      app.kubernetes.io/component: traffic-gate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-marketpay
        app.kubernetes.io/component: traffic-gate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: gate
          image: busybox:1.37
          command: ["/bin/sh", "-ec"]
          args:
            - mkdir -p /tmp/www; echo ready > /tmp/www/index.html; exec httpd -f -p 8080 -h /tmp/www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - wget -qO- http://marketpay-backend:4000/health/ready | grep -q '"status":"healthy"'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
