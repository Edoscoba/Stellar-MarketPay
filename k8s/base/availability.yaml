apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: marketpay-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-marketpay
      app.kubernetes.io/component: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: marketpay-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-marketpay
      app.kubernetes.io/component: frontend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stellar-marketpay
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 4000 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 8080 }
