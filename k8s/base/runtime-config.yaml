apiVersion: v1
kind: ConfigMap
metadata:
  name: marketpay-runtime-config
data:
  NODE_ENV: production
  PORT: "4000"
  STELLAR_NETWORK: testnet
  HORIZON_URL: https://horizon-testnet.stellar.org
  REDIS_URL: redis://marketpay-redis:6379
  ALLOWED_ORIGINS: https://marketpay.example.com
  NEXT_PUBLIC_API_URL: https://marketpay.example.com/api
  NEXT_PUBLIC_BASE_URL: https://marketpay.example.com
  NEXT_PUBLIC_STELLAR_NETWORK: testnet
  NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
  NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
  NEXT_PUBLIC_USE_CONTRACT_MOCK: "false"
  CLUSTER_ROLE: active
  REGION: primary-cluster
  REQUIRE_WRITABLE_DB: "true"
