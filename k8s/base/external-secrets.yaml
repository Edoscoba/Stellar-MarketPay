# The ClusterSecretStore is installed once per cluster and must point at a
# regionally replicated vault. See docs/dr/architecture.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marketpay-backend-secrets
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    name: marketpay-global-secrets
    kind: ClusterSecretStore
  target:
    name: marketpay-backend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: marketpay/production/backend
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marketpay-frontend-secrets
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    name: marketpay-global-secrets
    kind: ClusterSecretStore
  target:
    name: marketpay-frontend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: marketpay/production/frontend
