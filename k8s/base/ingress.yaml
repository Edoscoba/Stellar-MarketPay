apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketpay
  labels:
    app.kubernetes.io/name: stellar-marketpay
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [marketpay.example.com]
      secretName: marketpay-tls
  rules:
    - host: marketpay.example.com
      http:
        paths:
          - path: /__gslb-health
            pathType: Exact
            backend:
              service:
                name: marketpay-traffic-gate
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: marketpay-backend
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: marketpay-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: marketpay-frontend
                port:
                  name: http
